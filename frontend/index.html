<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UtilityHub — cloud and browser-local document utilities for PDFs, images, CSV, JSON, text, Word, and PowerPoint. Office files never leave your browser."
    />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="color-scheme" content="dark light" />
    <!--
      The development policy is intentionally permissive enough for Vite's dev
      client. Production CSP is delivered as strict response headers by
      Firebase Hosting (see firebase.json), which browsers intersect with this
      meta policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: http://localhost:4000 http://127.0.0.1:4000 https://*.googleapis.com https://*.firebaseapp.com https://*.run.app https://storage.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>UtilityHub — Cloud &amp; Local Document Utilities</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
